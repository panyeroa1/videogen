<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seamless Video Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #171717;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #525252;
        }

        /* Drag Overlay */
        #drop-overlay {
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .drag-active #drop-overlay {
            opacity: 1;
        }
        .drag-active {
            border-color: #ef4444 !important; /* Red-500 */
            background-color: rgba(239, 68, 68, 0.05);
        }
    </style>
</head>
<body class="bg-neutral-900 text-white font-sans h-screen flex overflow-hidden selection:bg-red-500 selection:text-white">

    <!-- Main Video Area -->
    <div class="flex-1 relative bg-black flex flex-col items-center justify-center group">
        
        <!-- Dual Player Engine -->
        <div class="relative w-full h-full">
            <!-- Player A -->
            <video id="player-a" class="absolute top-0 left-0 w-full h-full object-contain transition-opacity duration-500 opacity-100 z-10" playsinline></video>
            
            <!-- Player B -->
            <video id="player-b" class="absolute top-0 left-0 w-full h-full object-contain transition-opacity duration-500 opacity-0 z-0" playsinline></video>

            <!-- Start Overlay -->
            <div id="start-overlay" class="absolute inset-0 bg-black/60 z-50 flex items-center justify-center">
                <button id="start-btn" class="bg-red-600 hover:bg-red-700 text-white px-8 py-4 rounded-full font-bold text-xl flex items-center gap-2 shadow-lg transition-transform hover:scale-105">
                    <i data-lucide="play" fill="currentColor"></i> Start Playback
                </button>
            </div>
        </div>

        <!-- Floating Controls -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-neutral-800/90 backdrop-blur border border-neutral-700 px-6 py-3 rounded-2xl flex items-center gap-6 shadow-2xl z-40 transition-opacity duration-300 opacity-0 group-hover:opacity-100" id="controls-bar">
            <button id="prev-btn" class="text-neutral-400 hover:text-white transition-colors">
                <i data-lucide="skip-back" width="24" height="24"></i>
            </button>
            
            <button id="play-toggle-btn" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center hover:bg-neutral-200 transition-colors">
                <i id="play-icon" data-lucide="play" fill="black" class="ml-1" width="20" height="20"></i>
                <i id="pause-icon" data-lucide="pause" fill="black" width="20" height="20" class="hidden"></i>
            </button>

            <button id="next-btn" class="text-neutral-400 hover:text-white transition-colors">
                <i data-lucide="skip-forward" width="24" height="24"></i>
            </button>

            <div class="h-8 w-px bg-neutral-600 mx-2"></div>

            <div class="flex flex-col">
                <span class="text-xs text-neutral-400 uppercase tracking-wider font-bold">Now Playing</span>
                <span id="current-title" class="text-sm font-medium max-w-[200px] truncate">No Video Selected</span>
            </div>
        </div>

        <!-- Mobile Menu Toggle -->
        <button id="menu-toggle" class="absolute top-4 right-4 bg-neutral-800/80 p-2 rounded-lg lg:hidden z-50 text-white">
            <i data-lucide="list"></i>
        </button>
    </div>

    <!-- Sidebar / Playlist -->
    <div id="sidebar" class="fixed inset-y-0 right-0 w-80 bg-neutral-900 border-l border-neutral-800 shadow-xl transform transition-transform duration-300 ease-in-out z-50 lg:relative lg:translate-x-0 translate-x-full flex flex-col">
        
        <!-- Header -->
        <div class="p-5 border-b border-neutral-800 select-none">
            <!-- Title and Close Button Container -->
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="film" class="text-red-500"></i> Library
                </h2>
                <!-- New Close Button for Mobile -->
                <button id="close-sidebar-btn" class="p-1 rounded-full hover:bg-neutral-800 lg:hidden text-neutral-400 hover:text-white transition-colors">
                    <i data-lucide="x" width="20" height="20"></i>
                </button>
            </div>
            
            <div class="flex items-center justify-between mb-4">
                <span id="video-count" class="text-xs text-neutral-500 font-mono">0 VIDEOS</span>
                <button id="sort-btn" class="flex items-center gap-2 text-xs bg-neutral-800 hover:bg-neutral-700 px-3 py-1.5 rounded border border-neutral-700 transition-colors text-neutral-300">
                    <i id="sort-icon" data-lucide="clock" width="12"></i>
                    <span id="sort-text">Newest First</span>
                </button>
            </div>

            <!-- Upload / Drag Info -->
            <label class="flex items-center justify-center w-full gap-2 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 py-4 rounded border border-dashed border-neutral-600 cursor-pointer transition-colors text-sm hover:border-red-500 hover:text-red-400 relative overflow-hidden group">
                <i data-lucide="upload" width="14"></i> 
                <span>Add or Drop Videos</span>
                <input type="file" id="file-input" multiple accept="video/*" class="hidden" />
            </label>
        </div>

        <!-- Playlist Container (Drop Zone) -->
        <div id="playlist-container" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1 relative border-2 border-transparent transition-colors">
            
            <!-- Drop Overlay Message -->
            <div id="drop-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-neutral-900/90 z-20">
                <i data-lucide="download" class="text-red-500 w-12 h-12 mb-2 animate-bounce"></i>
                <span class="text-red-500 font-bold">Drop Files Here</span>
            </div>

            <div id="playlist-items">
                <!-- Items injected via JS -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center text-neutral-600 py-10 px-4">
                <p class="text-sm">No videos found.</p>
                <p class="text-xs mt-2">Upload or drag videos to begin.</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="p-3 bg-neutral-950 border-t border-neutral-800 text-[10px] text-neutral-600 font-mono text-center select-none">
            SEAMLESS TRANSITION ENGINE ACTIVE
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // --- Data & State ---
        const INITIAL_PLAYLIST = [
            {
                id: 'vid_1',
                title: 'Nature: Mountain Streams',
                src: 'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4',
                created: '2023-10-15T08:30:00'
            },
            {
                id: 'vid_2',
                title: 'Urban: City Timelapse',
                src: 'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4',
                created: '2023-09-01T14:20:00'
            },
            {
                id: 'vid_3',
                title: 'Abstract: Big Buck Bunny',
                src: 'https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
                created: '2023-12-25T18:00:00'
            },
            {
                id: 'vid_4',
                title: 'Tech: Elephants Dream',
                src: 'https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',
                created: '2023-11-10T09:15:00'
            }
        ];

        let state = {
            rawPlaylist: [...INITIAL_PLAYLIST],
            sortedPlaylist: [],
            currentIndex: 0,
            sortOrder: 'newest', // 'newest' | 'oldest'
            isPlaying: false,
            activePlayer: 'A', // 'A' | 'B'
            userInteracted: false,
            isSidebarOpen: false
        };

        // --- DOM Elements ---
        const playerA = document.getElementById('player-a');
        const playerB = document.getElementById('player-b');
        const startBtn = document.getElementById('start-btn');
        const startOverlay = document.getElementById('start-overlay');
        const playToggleBtn = document.getElementById('play-toggle-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const currentTitle = document.getElementById('current-title');
        const playlistItems = document.getElementById('playlist-items');
        const emptyState = document.getElementById('empty-state');
        const videoCount = document.getElementById('video-count');
        const sortBtn = document.getElementById('sort-btn');
        const sortText = document.getElementById('sort-text');
        const fileInput = document.getElementById('file-input');
        const playlistContainer = document.getElementById('playlist-container');
        const sidebar = document.getElementById('sidebar');
        const menuToggle = document.getElementById('menu-toggle');
        const closeSidebarBtn = document.getElementById('close-sidebar-btn'); // NEW ELEMENT

        // --- Core Logic ---

        function init() {
            processSort();
            renderPlaylist();
            setupEventListeners();
            lucide.createIcons();
            
            // Initial render of controls visibility
            updateControls();
        }

        function processSort() {
            state.sortedPlaylist = [...state.rawPlaylist].sort((a, b) => {
                const dateA = new Date(a.created);
                const dateB = new Date(b.created);
                return state.sortOrder === 'newest' ? dateB - dateA : dateA - dateB;
            });
            renderPlaylist();
            updateEngine(); // Ensure players load correct sources based on new order
        }

        function getNextIndex() {
            return (state.currentIndex + 1) % state.sortedPlaylist.length;
        }

        function getPrevIndex() {
            return (state.currentIndex - 1 + state.sortedPlaylist.length) % state.sortedPlaylist.length;
        }

        // --- The Seamless Engine ---

        function updateEngine() {
            if (state.sortedPlaylist.length === 0) return;

            const currentVid = state.sortedPlaylist[state.currentIndex];
            const nextVid = state.sortedPlaylist[getNextIndex()];
            
            // Current Title
            currentTitle.textContent = currentVid.title;

            const activeVidEl = state.activePlayer === 'A' ? playerA : playerB;
            const inactiveVidEl = state.activePlayer === 'A' ? playerB : playerA;

            // Load logic: Only change src if it's different to avoid reloading
            const loadVideo = (el, vidData) => {
                if (el.getAttribute('data-src') !== vidData.src) {
                    el.src = vidData.src;
                    el.setAttribute('data-src', vidData.src);
                    el.load();
                }
            };

            // 1. Ensure Active Player has current video
            loadVideo(activeVidEl, currentVid);

            // 2. Preload Inactive Player with next video
            loadVideo(inactiveVidEl, nextVid);

            // 3. Playback State
            if (state.isPlaying) {
                activeVidEl.play().catch(e => console.log("Autoplay blocked", e));
            } else {
                activeVidEl.pause();
            }

            // Ensure inactive is paused and ready
            inactiveVidEl.pause();
            inactiveVidEl.currentTime = 0;

            // 4. Visibility (CSS classes)
            if (state.activePlayer === 'A') {
                playerA.classList.remove('opacity-0', 'z-0');
                playerA.classList.add('opacity-100', 'z-10');
                playerB.classList.remove('opacity-100', 'z-10');
                playerB.classList.add('opacity-0', 'z-0');
            } else {
                playerB.classList.remove('opacity-0', 'z-0');
                playerB.classList.add('opacity-100', 'z-10');
                playerA.classList.remove('opacity-100', 'z-10');
                playerA.classList.add('opacity-0', 'z-0');
            }
        }

        function handleVideoEnd() {
            // The magic happens here: switch active player and play immediately
            const nextPlayerId = state.activePlayer === 'A' ? 'B' : 'A';
            const nextPlayerEl = state.activePlayer === 'A' ? playerB : playerA;

            nextPlayerEl.play().then(() => {
                state.activePlayer = nextPlayerId;
                state.currentIndex = getNextIndex();
                updateEngine(); // Will handle visibility swap
                renderPlaylist(); // Update UI highlight
            }).catch(e => {
                console.error("Seamless transition failed", e);
                // Fallback if play fails (rare)
                state.activePlayer = nextPlayerId;
                state.currentIndex = getNextIndex();
                updateEngine();
            });
        }

        function togglePlay() {
            state.isPlaying = !state.isPlaying;
            updateControls();
            
            const activeVidEl = state.activePlayer === 'A' ? playerA : playerB;
            if (state.isPlaying) {
                activeVidEl.play();
            } else {
                activeVidEl.pause();
            }
        }

        function skipNext() {
            state.isPlaying = false;
            // Short timeout to allow UI to settle before swapping logic manually
            setTimeout(() => {
                state.activePlayer = state.activePlayer === 'A' ? 'B' : 'A';
                state.currentIndex = getNextIndex();
                state.isPlaying = true;
                updateEngine();
                renderPlaylist();
                updateControls();
            }, 50);
        }

        function skipPrev() {
            state.isPlaying = false;
            setTimeout(() => {
                state.activePlayer = state.activePlayer === 'A' ? 'B' : 'A';
                state.currentIndex = getPrevIndex();
                state.isPlaying = true;
                updateEngine();
                renderPlaylist();
                updateControls();
            }, 50);
        }

        // --- UI Rendering ---

        function updateControls() {
            if (state.isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                startOverlay.classList.add('hidden');
                document.getElementById('controls-bar').style.opacity = '1';
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        function renderPlaylist() {
            playlistItems.innerHTML = '';
            videoCount.textContent = `${state.sortedPlaylist.length} VIDEOS`;

            if (state.sortedPlaylist.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            const nextIdx = getNextIndex();

            state.sortedPlaylist.forEach((vid, idx) => {
                const isActive = idx === state.currentIndex;
                const isNext = idx === nextIdx;

                const div = document.createElement('div');
                div.className = `group p-3 rounded-lg cursor-pointer transition-all border border-transparent mb-1 ${
                    isActive ? 'bg-red-500/10 border-red-500/30' : 'hover:bg-neutral-800'
                }`;
                
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <h3 class="text-sm font-medium leading-tight ${isActive ? 'text-red-400' : 'text-neutral-200 group-hover:text-white'}">
                            ${vid.title}
                        </h3>
                        ${isActive ? '<div class="w-2 h-2 rounded-full bg-red-500 animate-pulse mt-1"></div>' : ''}
                    </div>
                    <div class="flex items-center justify-between text-xs text-neutral-500">
                        <span>${new Date(vid.created).toLocaleDateString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</span>
                        ${isNext && !isActive ? '<span class="text-neutral-600 bg-neutral-800 px-1.5 rounded text-[10px]">UP NEXT</span>' : ''}
                    </div>
                `;

                div.onclick = () => {
                    // Manual selection jump
                    state.isPlaying = false;
                    setTimeout(() => {
                        state.activePlayer = state.activePlayer === 'A' ? 'B' : 'A';
                        state.currentIndex = idx;
                        state.isPlaying = true;
                        updateEngine();
                        renderPlaylist();
                        updateControls();
                    }, 50);
                };

                playlistItems.appendChild(div);
            });
        }

        // --- Event Listeners ---

        function setupEventListeners() {
            // Players
            playerA.onended = handleVideoEnd;
            playerB.onended = handleVideoEnd;

            // Buttons
            startBtn.onclick = () => {
                state.userInteracted = true;
                togglePlay();
            };
            playToggleBtn.onclick = togglePlay;
            nextBtn.onclick = skipNext;
            prevBtn.onclick = skipPrev;

            // Sorting
            sortBtn.onclick = () => {
                state.sortOrder = state.sortOrder === 'newest' ? 'oldest' : 'newest';
                sortText.textContent = state.sortOrder === 'newest' ? 'Newest First' : 'Oldest First';
                processSort();
            };

            // Mobile Menu
            const toggleSidebar = () => {
                state.isSidebarOpen = !state.isSidebarOpen;
                sidebar.classList.toggle('translate-x-full');
                sidebar.classList.toggle('translate-x-0');
            };

            // Existing toggle button (outside sidebar)
            menuToggle.onclick = toggleSidebar;

            // New close button (inside sidebar)
            closeSidebarBtn.onclick = toggleSidebar;

            // File Upload Input
            fileInput.onchange = (e) => handleFiles(e.target.files);

            // Drag and Drop
            setupDragAndDrop();
        }

        function setupDragAndDrop() {
            const dz = playlistContainer;

            // Prevent default drag behaviors
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dz.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false); // Prevent opening file in browser
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            // Highlight drop zone
            ['dragenter', 'dragover'].forEach(eventName => {
                dz.addEventListener(eventName, highlight, false);
            });
            ['dragleave', 'drop'].forEach(eventName => {
                dz.addEventListener(eventName, unhighlight, false);
            });

            function highlight(e) {
                dz.classList.add('drag-active');
            }

            function unhighlight(e) {
                dz.classList.remove('drag-active');
            }

            // Handle dropped files
            dz.addEventListener('drop', handleDrop, false);
        }

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        function handleFiles(files) {
            const fileArray = [...files];
            const newVideos = fileArray
                .filter(file => file.type.startsWith('video/'))
                .map(file => ({
                    id: `local_${Date.now()}_${Math.random()}`,
                    title: file.name,
                    src: URL.createObjectURL(file),
                    created: new Date(file.lastModified).toISOString()
                }));

            if (newVideos.length > 0) {
                state.rawPlaylist = [...state.rawPlaylist, ...newVideos];
                processSort();
                
                // If playlist was empty, start playing the new video
                if (state.sortedPlaylist.length === newVideos.length) {
                   state.currentIndex = 0;
                   updateEngine();
                }
            }
        }

        // Initialize
        init();

    </script>
</body>
</html>
